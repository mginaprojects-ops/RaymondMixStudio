name: Build Windows VST3
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: RaymondMixStudio
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "build/RaymondMixStudio_artefacts/Release/VST3/Raymond Mix Studio.vst3" package/
          Copy-Item -Recurse "build/RaymondMixStudio_artefacts/Release/Standalone" package/Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: RaymondMixStudio-Windows
          path: RaymondMixStudio/package
